services:
  media:
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    restart: unless-stopped
    environment:
      MTX_PATHS_CAMERA60RAW_SOURCE: ${CAMERA_PILOT_RTSP_URL:?Set CAMERA_PILOT_RTSP_URL}
    volumes:
      - ./mediamtx.camera-pilot.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997"
